<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Anderlecht - Evenementen</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: menu}"></div>

<main class="flex-grow container mx-auto p-8">
    <h1 class="text-3xl font-bold mb-6">Laatste Evenementen</h1>

    <table class="w-full bg-white shadow rounded">
        <thead class="bg-green-700 text-white">
        <tr>
            <th class="p-3 text-left">Titel</th>
            <th class="p-3 text-left">Organisatie</th>
            <th class="p-3 text-left">Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}" class="border-b">
            <td class="p-3" th:text="${event.titel}"></td>
            <td class="p-3" th:text="${event.organisatie}"></td>
            <td class="p-3">
                <a th:href="@{/details/{id}(id=${event.id})}" class="text-green-700 hover:underline">Bekijk</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-6">
        <a th:href="@{/new}" class="bg-green-700 text-white px-4 py-2 rounded hover:bg-green-800">Nieuw Evenement Toevoegen</a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
