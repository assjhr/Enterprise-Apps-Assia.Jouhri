<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: menu}"></div>

<main class="flex-grow container mx-auto px-6 py-12">
    <div class="max-w-3xl mx-auto">
        <a th:href="@{/}" class="inline-flex items-center text-purple-600 hover:text-pink-600 font-semibold mb-6 transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Terug naar overzicht
        </a>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-pink-500 p-8">
                <h1 class="text-4xl font-bold text-white mb-2" th:text="${event.titel}"></h1>
                <p class="text-pink-100 text-lg" th:text="${event.organisatie}"></p>
            </div>

            <div class="p-8 space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="flex items-start">
                        <div class="bg-purple-100 p-3 rounded-lg mr-4">
                            <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-800">Tijdstip</h3>
                            <p class="text-gray-600" th:text="${event.tijdstip}"></p>
                        </div>
                    </div>

                    <div class="flex items-start">
                        <div class="bg-pink-100 p-3 rounded-lg mr-4">
                            <svg class="w-6 h-6 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-800">Contact Email</h3>
                            <p class="text-gray-600" th:text="${event.contactEmail}"></p>
                        </div>
                    </div>
                </div>

                <div th:if="${event.locatie != null}" class="flex items-start">
                    <div class="bg-indigo-100 p-3 rounded-lg mr-4">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-800">Locatie</h3>
                        <p class="text-gray-600" th:text="${event.locatie.naam}"></p>
                        <p class="text-gray-500 text-sm" th:text="${event.locatie.adres}"></p>
                        <p class="text-gray-500 text-sm">Capaciteit: <span th:text="${event.locatie.capaciteit}"></span> personen</p>
                    </div>
                </div>

                <div th:if="${event.locatie == null}" class="flex items-start">
                    <div class="bg-gray-100 p-3 rounded-lg mr-4">
                        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-800">Locatie</h3>
                        <p class="text-gray-500">Niet opgegeven</p>
                    </div>
                </div>

                <div class="border-t pt-6">
                    <h3 class="font-semibold text-gray-800 mb-3">Omschrijving</h3>
                    <p class="text-gray-600 leading-relaxed" th:text="${event.omschrijving}">Geen omschrijving beschikbaar</p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
