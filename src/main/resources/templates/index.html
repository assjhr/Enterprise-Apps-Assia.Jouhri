<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Anderlecht - Evenementen</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: menu}"></div>

<!-- Hero Section -->
<section class="bg-gradient-to-br from-pink-500 via-purple-500 to-indigo-500 text-white py-16">
    <div class="container mx-auto px-6 text-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-4">Welkom bij NGO Anderlecht</h1>
        <p class="text-xl md:text-2xl opacity-90 mb-8">Samen bouwen we een sterkere gemeenschap</p>
        <a th:href="@{/new}" class="inline-block bg-white text-purple-600 px-8 py-3 rounded-full font-semibold text-lg hover:bg-pink-100 transition-all transform hover:scale-105 shadow-lg">
            Bekijk Evenementen
        </a>
    </div>
</section>

<main class="flex-grow container mx-auto px-6 py-12">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold text-gray-800">Laatste Evenementen</h2>
        <a th:href="@{/new}" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-6 py-3 rounded-full font-semibold hover:shadow-lg transition-all transform hover:scale-105">
            + Nieuw Evenement
        </a>
    </div>

    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        <div th:each="event : ${events}" class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all transform hover:-translate-y-1 overflow-hidden">
            <div class="bg-gradient-to-r from-pink-500 to-purple-600 h-2"></div>
            <div class="p-6">
                <h3 class="text-xl font-bold text-gray-800 mb-2" th:text="${event.titel}"></h3>
                <p class="text-purple-600 font-medium mb-4" th:text="${event.organisatie}"></p>
                <div class="flex items-center text-sm text-gray-500 mb-4">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span th:text="${event.tijdstip}"></span>
                </div>
                <div class="flex justify-between items-center">
                    <a th:href="@{/details/{id}(id=${event.id})}" class="text-purple-600 hover:text-pink-600 font-semibold transition-colors">
                        Bekijk details →
                    </a>
                    <a th:href="@{/delete/{id}(id=${event.id})}" class="text-red-500 hover:text-red-700 transition-colors" onclick="return confirm('Weet je zeker dat je dit evenement wilt verwijderen?')">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
