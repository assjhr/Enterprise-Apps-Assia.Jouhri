<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: menu}"></div>

<main class="flex-grow container mx-auto p-8">
    <h1 class="text-3xl font-bold mb-6" th:text="${event.titel}"></h1>

    <div class="bg-white shadow rounded p-6 max-w-lg space-y-3">
        <p><strong>Tijdstip:</strong> <span th:text="${event.tijdstip}"></span></p>
        <p><strong>Organisatie:</strong> <span th:text="${event.organisatie}"></span></p>
        <p><strong>Contact Email:</strong> <span th:text="${event.contactEmail}"></span></p>
        <p><strong>Omschrijving:</strong> <span th:text="${event.omschrijving}"></span></p>
        <p><strong>Locatie:</strong> <span th:text="${event.locatie.naam}"></span></p>
        <p><strong>Adres:</strong> <span th:text="${event.locatie.adres}"></span></p>
        <p><strong>Capaciteit:</strong> <span th:text="${event.locatie.capaciteit}"></span> personen</p>
    </div>

    <div class="mt-6">
        <a th:href="@{/}" class="text-green-700 hover:underline">Terug naar overzicht</a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
