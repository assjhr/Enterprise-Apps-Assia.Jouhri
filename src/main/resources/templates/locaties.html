<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locaties</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: menu}"></div>

<main class="flex-grow container mx-auto px-6 py-12">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden mb-8">
            <div class="bg-pink-500 p-8">
                <h1 class="text-3xl font-bold text-white">Locaties Beheren</h1>
                <p class="text-pink-100 mt-2">Voeg nieuwe locaties toe of beheer bestaande</p>
            </div>

            <form th:action="@{/locaties}" th:object="${locatie}" method="post" class="p-8">
                <h2 class="text-xl font-bold text-gray-800 mb-6">Nieuwe Locatie</h2>
                <div class="grid md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Naam *</label>
                        <input type="text" th:field="*{naam}" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-purple-500 focus:outline-none transition-colors" placeholder="Locatie naam" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Adres *</label>
                        <input type="text" th:field="*{adres}" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-purple-500 focus:outline-none transition-colors" placeholder="Volledig adres" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Capaciteit *</label>
                        <input type="number" th:field="*{capaciteit}" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-purple-500 focus:outline-none transition-colors" placeholder="Aantal personen" required>
                    </div>
                </div>
                <button type="submit" class="bg-pink-500 text-white px-6 py-3 rounded-lg font-semibold hover:shadow-lg transition-all transform hover:scale-105">
                    + Locatie Toevoegen
                </button>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="p-8">
                <h2 class="text-xl font-bold text-gray-800 mb-6">Bestaande Locaties</h2>
                <div class="grid gap-4 md:grid-cols-2">
                    <div th:each="loc : ${locaties}" class="border-2 border-gray-100 rounded-xl p-6 hover:border-purple-300 transition-colors">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <h3 class="font-bold text-gray-800 text-lg mb-2" th:text="${loc.naam}"></h3>
                                <p class="text-gray-600 mb-2" th:text="${loc.adres}"></p>
                                <span class="inline-block bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm font-medium">
                                    <span th:text="${loc.capaciteit}"></span> personen
                                </span>
                            </div>
                            <a th:href="@{/locaties/delete/{id}(id=${loc.id})}" class="text-red-500 hover:text-red-700 transition-colors ml-4" onclick="return confirm('Weet je zeker dat je deze locatie wilt verwijderen?')">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
